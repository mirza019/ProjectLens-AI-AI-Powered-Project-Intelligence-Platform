name: Publish demo containers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/mirza019/projectlens-ai-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VITE_API_URL=https://projectlens-api.icywater-653510cb.polandcentral.azurecontainerapps.io/api/v1
          tags: ghcr.io/mirza019/projectlens-ai-web:latest
