services:
  frontend:
    build: .
    ports: ["5173:80"]
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://projectlens:projectlens@postgres:5432/projectlens
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGINS: http://localhost:5173
      DOCUMENT_ROOT: /app/output/documents
    volumes: [projectlens_documents:/app/output/documents]
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: projectlens
      POSTGRES_PASSWORD: projectlens
      POSTGRES_DB: projectlens
    volumes: [projectlens_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U projectlens"], interval: 5s, timeout: 5s, retries: 10}
volumes:
  projectlens_data:
  projectlens_documents:
